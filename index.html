<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob URL Generator</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f4f9;
    padding: 25px;
}
.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
textarea {
    width: 100%;
    height: 300px;
    padding: 12px;
    box-sizing: border-box;
}
button {
    padding: 12px 20px;
    margin: 10px 5px 10px 0;
    background: #1769e0;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#result {
    word-break: break-all;
    padding: 12px;
    background: #eee;
}
</style>
</head>
<body>

<div class="container">
<h2>HTML Blob URL Generator</h2>

<p>Paste your HTML content below:</p>

<textarea id="htmlCode" placeholder="Paste your HTML code here..."></textarea>

<br>

<button onclick="generateBlob()">Generate Blob URL</button>
<button onclick="openBlob()">Open URL</button>
<button onclick="copyURL()">Copy URL</button>

<h3>Generated URL:</h3>
<div id="result">Your URL will appear here.</div>

</div>

<script>
let blobURL = "";

function generateBlob() {
    const html = document.getElementById("htmlCode").value;

    if (!html.trim()) {
        alert("Please paste your HTML content first.");
        return;
    }

    if (blobURL) URL.revokeObjectURL(blobURL);

    const blob = new Blob([html], {
        type: "text/html"
    });

    blobURL = URL.createObjectURL(blob);

    document.getElementById("result").textContent = blobURL;
}

function openBlob() {
    if (!blobURL) {
        alert("Generate a URL first.");
        return;
    }
    window.open(blobURL, "_blank");
}

function copyURL() {
    if (!blobURL) {
        alert("Generate a URL first.");
        return;
    }

    navigator.clipboard.writeText(blobURL)
        .then(() => alert("Blob URL copied!"))
        .catch(() => alert("Unable to copy URL."));
}
</script>

</body>
</html>
