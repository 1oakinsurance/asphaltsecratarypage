<!DOCTYPE html>
<html>
<head>
<title>Blob URL Creator</title>
</head>
<body>

<h2>Generate Your Blob Link</h2>

<button onclick="generateBlob()">Generate Link</button>

<div id="result"></div>

<script>
function generateBlob() {
const html = `
<html>
<body>
<h1>Hello!</h1>
<p>This is my HTML content.</p>
</body>
</html>`;

const blob = new Blob([html], {
type: "text/html"
});

const url = URL.createObjectURL(blob);

document.getElementById("result").innerHTML =
`<a href="${url}" target="_blank">${url}</a>`;
}
</script>

</body>
</html>
